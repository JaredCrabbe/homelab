services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: Homepage
    restart: unless-stopped
    networks: 
      - homelab
    
    volumes:
      - ./config:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.arpa
      LOG_LEVEL: debug
      HOMEPAGE_VAR_PLEX_TOKEN: ${PLEX_TOKEN}
      HOMEPAGE_VAR_SERVICE_USER: ${SERVICE_USER}
      HOMEPAGE_VAR_SERVICE_PASS: ${SERVICE_PASS}


networks:
  homelab:
    external: true 
