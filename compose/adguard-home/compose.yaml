services:
  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home

    restart: unless-stopped
    networks:
      - homelab


    ports:
      - "53:53/tcp"
      - "53:53/udp"

      - "8088:8088"


    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
      
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8088/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3


volumes:
   adguard-work:
     external: true


   adguard-conf:
      external: true

networks:
    homelab:
      external: true
