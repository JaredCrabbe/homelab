[global]
    server string = samba
    security = user
    server min protocol = SMB2
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    host msdfs = no

[shares]
    comment = Shared
    path = /storage
    browseable = yes
    writable = yes
    read only = no

    force user = jared
    force group = smb

    create mask = 0660
    force create mode = 0660
    directory mask = 2770
    force directory mode = 2770
