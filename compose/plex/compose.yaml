services:
   plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    
    restart: unless-stopped
    security_opt:
     - label=disable 

  
    ports:
    - "32400:32400"
    
    environment:
      PUID: "1000"
      PGID: "1001"
      TZ: Africa/Johannesburg
      VERSION: docker
    

    volumes:
      - plex-config:/config
      - /srv/nas/media:/media:z
      - /tmp:/transcode

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]  


volumes:
  plex-config:
    external: true 
